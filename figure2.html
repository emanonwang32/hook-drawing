<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>卡通轮廓 · 圆弧连接分步作图</title>
<style>
  :root{--paper:#fbfaf6;--amber:#d99a2b;--teal:#2f8f83;--dim:#3c4d63;--txt:#22303f;--muted:#6b7b8f}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100%}
  body{font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
       background:linear-gradient(180deg,#eef2f7 0%,#e7edf4 100%);color:var(--txt);min-height:100vh}
  .app{max-width:1340px;margin:0 auto;padding:14px 18px 22px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .sub{font-size:13px;color:var(--muted)}
  .main{display:grid;grid-template-columns:minmax(300px,368px) 1fr;gap:16px;align-items:start}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(24,50,80,.09);padding:13px 15px;min-width:0}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .steplist{display:flex;flex-direction:column;gap:3px;max-height:clamp(140px,26vh,300px);overflow:auto;padding-right:4px;min-width:0}
  .stepbtn{display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;border:1px solid transparent;background:#f6f8fb;
    border-radius:8px;padding:5px 8px;cursor:pointer;font:inherit;font-size:12.8px;color:#3a4a5e;text-align:left;transition:.16s;line-height:1.3}
  .stepbtn:hover{background:#eef4fb;border-color:#cfe0f2}
  .stepbtn .num{font-size:10.5px;color:#93a3b8;text-align:center}
  .stepbtn.active{background:#e8f1fc;border-color:#9dc2e8;color:#123a63;font-weight:600}
  .stepbtn.active .num{color:#4f7fb8}
  .stepbtn.done .num{color:#2f8f83}
  h2.sec{font-size:11.5px;letter-spacing:2.4px;color:#8a9bb0;font-weight:600;margin:0 0 8px}
  .infotitle{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .badge{background:#123a63;color:#fff;border-radius:7px;font-size:11.5px;padding:2px 7px}
  .infotitle b{font-size:14.5px}
  .body{font-size:13px;line-height:1.72;color:#2d3d4f}
  .body p{margin:0 0 6px}.body b{color:#123a63}.body .hi{color:#b03a2e;font-weight:600}
  .keybox{background:#f3f8f5;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12.2px;line-height:1.6;color:#2e4a44;margin-top:2px}
  .keybox b{color:#1d6d61}.keybox ul{margin:3px 0 0;padding-left:15px}.keybox li{margin:1px 0}
  .formula{font-family:"Cambria","Times New Roman",serif;background:#f8f5ec;border:1px dashed #ddd2b6;border-radius:8px;padding:5px 10px;font-size:12.6px;color:#6a5320;margin:7px 0 0}
  .stage{padding:8px 10px 10px}
  .svgbox{display:flex;justify-content:center;background:var(--paper);border-radius:10px}
  svg#dw{display:block;height:calc(100vh - 286px);min-height:400px;width:auto;max-width:100%}
  .controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 3px 0}
  button.ctl{font:inherit;font-size:12.6px;border-radius:9px;border:1px solid #cfdae7;background:#fff;color:#2b3d52;padding:6px 11px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:5px}
  button.ctl:hover{background:#f1f6fc;border-color:#a9c3de}
  button.ctl:disabled{opacity:.42;cursor:default}
  button.ctl.primary{background:#123a63;border-color:#123a63;color:#fff}
  button.ctl.primary:hover{background:#1b4c7e}
  .spacer{flex:1}
  .progress{height:5px;background:#e4ebf3;border-radius:99px;overflow:hidden;margin:2px 4px 6px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7fb8,#2f8f83);transition:width .45s ease}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;color:#4a5c72;cursor:pointer;user-select:none}
  .chk input{accent-color:#4f7fb8}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.6px;color:#5b6b7f;padding:5px 6px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:20px;border-top:3px solid #16283f}
  .legend i.c{border-top:1.5px dashed #8fb0d6}.legend i.a{border-top:1.5px dashed #d99a2b}.legend i.d{border-top:1.5px solid #3c4d63}
  .hint{font-size:11.8px;color:var(--muted);padding:6px 6px 0;line-height:1.7;display:flex;gap:14px;flex-wrap:wrap}
  .dimtable{display:grid;grid-template-columns:1fr 1fr;gap:3px 7px;font-size:11.8px}
  .dimrow{display:flex;gap:5px;padding:2px 4px;border-radius:6px;background:#f7f9fc}
  .dimrow b{color:#123a63;font-family:"Cambria","Times New Roman",serif;min-width:38px}
  .dimrow span{color:#5b6b7f;line-height:1.3}
  .center{stroke:#8fb0d6;stroke-width:.22;fill:none;stroke-dasharray:5 1.4 .7 1.4}
  .aux{stroke:var(--amber);stroke-width:.19;fill:none;stroke-dasharray:1.5 1.1}
  .auxline{stroke:var(--teal);stroke-width:.19;fill:none;stroke-dasharray:2.6 1.4}
  .sketch{stroke:#2c4058;stroke-width:.48;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .7s ease,stroke .7s ease}
  .mark{stroke:#c8412f;stroke-width:.24;fill:none;stroke-linecap:round}
  .ring{stroke:#e0703c;stroke-width:.26;fill:none}
  .dline{stroke:var(--dim);stroke-width:.19;fill:none;stroke-linecap:round}
  .darrow{fill:var(--dim)}
  .dtext{fill:#202f42;font-family:"Cambria","Times New Roman",serif;font-size:3.2px;text-anchor:middle;dominant-baseline:middle}
  .clabel{fill:#a8452f;font-family:"Cambria","Times New Roman",serif;font-size:2.1px;dominant-baseline:middle}
  #dw.deep .sketch{stroke-width:.86;stroke:#08131f}
  @media (max-width:920px){
    .main{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:stretch}
    .spacer{display:none}
    .stage{order:-1}
    .steplist{max-height:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
    .stepbtn{flex:0 0 auto;grid-template-columns:20px auto;font-size:12px;padding:5px 8px}
    svg#dw{height:auto;width:min(100%, calc(62vh * 0.78));min-height:0;margin:0 auto}
    header h1{font-size:17px}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:stretch;padding-top:8px}
    .controls button.ctl{width:100%;justify-content:center;padding:8px 4px;font-size:12px}
    .legend{gap:8px;font-size:11px}
  }
  @media (max-width:400px){
    .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>卡通轮廓 · 圆弧连接分步作图</h1>
    <span class="sub">按修正后的比例：R1800 头 · R6000/R3000 身体 · R1200 手 · 1600×3 腿 · 处处相切</span>
  </header>
  <div class="main">
    <div class="col">
      <div class="card"><h2 class="sec">作 图 步 骤</h2><div class="steplist" id="steplist"></div></div>
      <div class="card">
        <div class="infotitle"><span class="badge" id="stepno">00</span><b id="steptitle">准备</b></div>
        <div class="body" id="stepbody"><p>点击「播放」或「下一步」开始。</p></div>
        <div class="keybox" id="stepkeys"></div>
        <div class="formula" id="stepform" style="display:none"></div>
      </div>
      <div class="card"><h2 class="sec">尺 寸 含 义</h2><div class="dimtable" id="dimtable"></div></div>
    </div>
    <div class="card stage">
      <div class="progress"><i id="bar"></i></div>
      <div class="svgbox">
        <svg id="dw" viewBox="-5700 -2300 11500 11000" xmlns="http://www.w3.org/2000/svg" width="1150" height="1100">
          <style>
            .center{stroke:#8fb0d6;stroke-width:22;fill:none;stroke-dasharray:420 120 60 120}
            .aux{stroke:#d99a2b;stroke-width:19;fill:none;stroke-dasharray:150 110}
            .auxline{stroke:#2f8f83;stroke-width:19;fill:none;stroke-dasharray:260 140}
            .sketch{stroke:#2c4058;stroke-width:50;fill:none;stroke-linecap:round;stroke-linejoin:round}
            .mark{stroke:#c8412f;stroke-width:26;fill:none;stroke-linecap:round}
            .ring{stroke:#e0703c;stroke-width:28;fill:none}
            .dline{stroke:#3c4d63;stroke-width:19;fill:none;stroke-linecap:round}
            .darrow{fill:#3c4d63}
            .dtext{fill:#202f42;font-family:'Cambria','Times New Roman',serif;font-size:235px;text-anchor:middle;dominant-baseline:middle}
            .clabel{fill:#a8452f;font-family:'Cambria','Times New Roman',serif;font-size:150px;dominant-baseline:middle}
            #dw.deep .sketch{stroke-width:92;stroke:#08131f}
          </style>
          <defs>
            <pattern id="g5" width="500" height="500" patternUnits="userSpaceOnUse">
              <path d="M500 0H0V500" fill="none" stroke="#eef2f6" stroke-width="12"/>
            </pattern>
            <pattern id="g25" width="2500" height="2500" patternUnits="userSpaceOnUse">
              <rect width="2500" height="2500" fill="url(#g5)"/>
              <path d="M2500 0H0V2500" fill="none" stroke="#e1e9f2" stroke-width="16"/>
            </pattern>
          </defs>
          <rect x="-5700" y="-2300" width="11500" height="11000" fill="url(#g25)"/>
        </svg>
      </div>
      <div class="controls">
        <button class="ctl" id="btnPrev">◀ 上一步</button>
        <button class="ctl primary" id="btnPlay">▶ 播放</button>
        <button class="ctl" id="btnNext">下一步 ▶</button>
        <button class="ctl" id="btnReset">↺ 重来</button>
        <span class="spacer"></span>
        <label class="chk"><input type="checkbox" id="showaux" checked> 辅助线</label>
        <button class="ctl" id="btnPng">导出 PNG</button>
      </div>
      <div class="legend"><span><i></i>粗实线：轮廓</span><span><i class="c"></i>点画线：中心线</span><span><i class="a"></i>虚线：作图辅助</span><span><i class="d"></i>细实线：尺寸</span></div>
      <div class="hint"><span>键盘 <b>←</b> <b>→</b> <b>空格</b></span><span>点击左侧步骤可跳转</span></div>
    </div>
  </div>
</div>

   ["4800", "底部总宽"], ["1600", "嘴宽"], ["8500", "总高"], ["对称", "左右完全对称"]
  ].forEach(([a, b]) => { const d = document.createElement("div"); d.className = "dimrow"; d.innerHTML = `<b>${a}</b><span>${b}</span>`; table.appendChild(d); });
  document.getElementById("btnPrev").onclick = () => { stop(); gotoStep(cur - 1, false); };
  document.getElementById("btnNext").onclick = () => { stop(); gotoStep(cur + 1, true); };
  document.getElementById("btnPlay").onclick = play;
  document.getElementById("btnReset").onclick = reset;
  document.getElementById("showaux").onchange = applyAux;
  document.getElementById("btnPng").onclick = () => {
    const cl = svg.cloneNode(true);
    cl.setAttribute("width", 1200); cl.setAttribute("height", Math.round(1200 * 10300 / 11000));
    const s = new XMLSerializer().serializeToString(cl);
    const url = URL.createObjectURL(new Blob([s], { type: "image/svg+xml;charset=utf-8" }));
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas"); c.width = 1200; c.height = Math.round(1200 * 10300 / 11000);
      const ctx = c.getContext("2d"); ctx.fillStyle = "#fbfaf6"; ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      const a = document.createElement("a"); a.download = "卡通轮廓-第" + cur + "步.png"; a.href = c.toDataURL("image/png"); a.click();
      URL.revokeObjectURL(url);
    };
    img.src = url;
  };
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") { stop(); gotoStep(cur + 1, true); e.preventDefault(); }
    else if (e.key === "ArrowLeft") { stop(); gotoStep(cur - 1, false); e.preventDefault(); }
    else if (e.key === " ") { play(); e.preventDefault(); }
  });
  const q = new URLSearchParams(location.search), st = parseInt(q.get("step") || "0", 10);
  if (st > 0) gotoStep(Math.min(st, STEPS.length), false); else gotoStep(1, false);
  updateUI(); applyAux();
})();

</script>
</body>
</html>
