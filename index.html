<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>吊钩 · 圆弧连接分步作图演示</title>
<style>
  :root{
    --paper:#fbfaf6; --amber:#d99a2b; --teal:#2f8f83;
    --dim:#3c4d63; --txt:#22303f; --muted:#6b7b8f;
  }
  *{box-sizing:border-box}
  html,body{overflow-x:hidden;max-width:100%}
  html,body{margin:0;padding:0}
  body{
    font-family:"Microsoft YaHei","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
    background:linear-gradient(180deg,#eef2f7 0%,#e7edf4 100%);
    color:var(--txt); min-height:100vh;
  }
  .app{max-width:1340px;margin:0 auto;padding:14px 18px 22px}
  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:12px}
  header h1{font-size:20px;margin:0;letter-spacing:.5px}
  header .sub{font-size:13px;color:var(--muted)}
  .main{display:grid;grid-template-columns:minmax(300px,368px) 1fr;gap:16px;align-items:start}
  .card{background:#fff;border-radius:14px;box-shadow:0 2px 14px rgba(24,50,80,.09);padding:13px 15px;min-width:0}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .steplist{display:flex;flex-direction:column;gap:3px;max-height:clamp(140px,26vh,300px);overflow:auto;padding-right:4px;min-width:0}
  .stepbtn{
    display:grid;grid-template-columns:22px 1fr;gap:8px;align-items:center;
    border:1px solid transparent;background:#f6f8fb;border-radius:8px;padding:5px 8px;cursor:pointer;
    font:inherit;font-size:12.8px;color:#3a4a5e;text-align:left;transition:.16s;line-height:1.3
  }
  .stepbtn:hover{background:#eef4fb;border-color:#cfe0f2}
  .stepbtn .num{font-size:10.5px;color:#93a3b8;font-variant-numeric:tabular-nums;text-align:center}
  .stepbtn.active{background:#e8f1fc;border-color:#9dc2e8;color:#123a63;font-weight:600}
  .stepbtn.active .num{color:#4f7fb8}
  .stepbtn.done .num{color:#2f8f83}
  h2.sec{font-size:11.5px;letter-spacing:2.4px;color:#8a9bb0;font-weight:600;margin:0 0 8px}
  .infotitle{display:flex;align-items:center;gap:8px;margin-bottom:7px}
  .badge{background:#123a63;color:#fff;border-radius:7px;font-size:11.5px;padding:2px 7px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .infotitle b{font-size:14.5px}
  .body{font-size:13px;line-height:1.72;color:#2d3d4f}
  .body p{margin:0 0 6px}
  .body b{color:#123a63}
  .body .hi{color:#b03a2e;font-weight:600}
  .keybox{background:#f3f8f5;border-left:3px solid var(--teal);border-radius:0 8px 8px 0;padding:7px 10px;font-size:12.2px;line-height:1.6;color:#2e4a44;margin-top:2px}
  .keybox b{color:#1d6d61}
  .keybox ul{margin:3px 0 0;padding-left:15px}
  .keybox li{margin:1px 0}
  .formula{font-family:"Cambria","Times New Roman",serif;background:#f8f5ec;border:1px dashed #ddd2b6;border-radius:8px;padding:5px 10px;font-size:12.6px;color:#6a5320;margin:7px 0 0}
  .stage{padding:8px 10px 10px}
  .svgbox{display:flex;justify-content:center;background:var(--paper);border-radius:10px}
  svg#dw{display:block;height:calc(100vh - 268px);min-height:420px;width:auto;max-width:100%}
  .controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px 3px 0}
  button.ctl{
    font:inherit;font-size:12.6px;border-radius:9px;border:1px solid #cfdae7;background:#fff;color:#2b3d52;
    padding:6px 11px;cursor:pointer;transition:.16s;display:inline-flex;align-items:center;gap:5px
  }
  button.ctl:hover{background:#f1f6fc;border-color:#a9c3de}
  button.ctl:disabled{opacity:.42;cursor:default}
  button.ctl.primary{background:#123a63;border-color:#123a63;color:#fff}
  button.ctl.primary:hover{background:#1b4c7e}
  .spacer{flex:1}
  .progress{height:5px;background:#e4ebf3;border-radius:99px;overflow:hidden;margin:2px 4px 6px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4f7fb8,#2f8f83);transition:width .45s ease}
  .chk{display:inline-flex;align-items:center;gap:5px;font-size:12.2px;color:#4a5c72;cursor:pointer;user-select:none}
  .chk input{accent-color:#4f7fb8}
  select.ctl{font:inherit;font-size:12.2px;border-radius:9px;border:1px solid #cfdae7;padding:5px 5px;background:#fff;color:#2b3d52}
  .hint{font-size:11.8px;color:var(--muted);padding:6px 6px 0;line-height:1.7;display:flex;gap:14px;flex-wrap:wrap}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.6px;color:#5b6b7f;padding:5px 6px 0}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .legend i{display:inline-block;width:20px;border-top:3px solid #16283f}
  .legend i.c{border-top:1.5px dashed #8fb0d6}
  .legend i.a{border-top:1.5px dashed #d99a2b}
  .legend i.d{border-top:1.5px solid #3c4d63}
  .dimtable{display:grid;grid-template-columns:1fr 1fr;gap:3px 7px;font-size:11.8px}
  .dimrow{display:flex;gap:5px;padding:2px 4px;border-radius:6px;background:#f7f9fc}
  .dimrow b{color:#123a63;font-family:"Cambria","Times New Roman",serif;min-width:30px}
  .dimrow span{color:#5b6b7f;line-height:1.3}
  .thumb{margin-top:8px;text-align:center}
  .thumb img{width:100%;max-width:320px;border-radius:8px;border:1px solid #e2e8ef;display:none}
  .thumb img.on{display:inline-block}
  .center{stroke:#8fb0d6;stroke-width:.22;fill:none;stroke-dasharray:5 1.4 .7 1.4}
  .aux{stroke:var(--amber);stroke-width:.19;fill:none;stroke-dasharray:1.5 1.1}
  .auxline{stroke:var(--teal);stroke-width:.19;fill:none;stroke-dasharray:2.6 1.4}
  .sketch{stroke:#2c4058;stroke-width:.48;fill:none;stroke-linecap:round;stroke-linejoin:round;transition:stroke-width .7s ease,stroke .7s ease}
  .mark{stroke:#c8412f;stroke-width:.24;fill:none;stroke-linecap:round}
  .ring{stroke:#e0703c;stroke-width:.26;fill:none}
  .dline{stroke:var(--dim);stroke-width:.19;fill:none;stroke-linecap:round}
  .darrow{fill:var(--dim)}
  .dtext{fill:#202f42;font-family:"Cambria","Times New Roman",serif;font-size:3.4px;text-anchor:middle;dominant-baseline:middle}
  .clabel{fill:#a8452f;font-family:"Cambria","Times New Roman",serif;font-size:2.25px;dominant-baseline:middle}
  #dw.deep .sketch{stroke-width:.86;stroke:#08131f}
  @media (max-width:400px){
    .controls{grid-template-columns:repeat(2,minmax(0,1fr))}
    .controls select.ctl{grid-column:span 2}
  }
  @media (max-width:920px){
    .main{display:flex;flex-direction:column;gap:12px;min-width:0;align-items:stretch}
    .spacer{display:none}
    .controls{justify-content:flex-start}
    .stage{order:-1}
    .col{display:flex;flex-direction:column;gap:12px}
    .steplist{max-height:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .stepbtn{flex:0 0 auto;grid-template-columns:20px auto;font-size:12px;padding:5px 8px}
    svg#dw{height:auto;width:min(100%, calc(64vh * 0.7778));max-width:100%;min-height:0;margin:0 auto}
    header h1{font-size:17px}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;align-items:stretch;padding-top:8px}
    .controls button.ctl{width:100%;justify-content:center;padding:8px 4px;font-size:12px}
    .controls select.ctl{grid-column:span 2;width:100%}
    .controls .chk{justify-content:center;background:#f5f8fc;border-radius:9px;padding:7px 2px;min-width:0}
    .legend{gap:8px;font-size:11px}
    .legend i{width:14px;margin-right:3px}
    .hint{gap:6px;font-size:11px}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>吊钩 · 圆弧连接分步作图</h1>
    <span class="sub">定基准 → 定形 → 求圆心 → 画弧 → 修剪 → 加深 → 标注</span>
  </header>

  <div class="main">
    <div class="col">
      <div class="card">
        <h2 class="sec">作 图 步 骤</h2>
        <div class="steplist" id="steplist"></div>
      </div>
      <div class="card">
        <div class="infotitle"><span class="badge" id="stepno">00</span><b id="steptitle">准备</b></div>
        <div class="body" id="stepbody"><p>点击「播放」或「下一步」开始分步作图。</p></div>
        <div class="keybox" id="stepkeys"></div>
        <div class="formula" id="stepform" style="display:none"></div>
      </div>
      <div class="card">
        <h2 class="sec">尺 寸 含 义</h2>
        <div class="dimtable" id="dimtable"></div>
        <div style="margin-top:9px">
          <label class="chk"><input type="checkbox" id="showref"> 显示原题照片</label>
          <div class="thumb"><img id="refimg" alt="原题照片"></div>
        </div>
      </div>
    </div>

    <div class="card stage">
      <div class="progress"><i id="bar"></i></div>
      <div class="svgbox">
        <svg id="dw" viewBox="-50 -90 98 126" xmlns="http://www.w3.org/2000/svg" width="98" height="126">
          <style>
          .center{stroke:#8fb0d6;stroke-width:.22;fill:none;stroke-dasharray:5 1.4 .7 1.4}
          .aux{stroke:#d99a2b;stroke-width:.19;fill:none;stroke-dasharray:1.5 1.1}
          .auxline{stroke:#2f8f83;stroke-width:.19;fill:none;stroke-dasharray:2.6 1.4}
          .sketch{stroke:#2c4058;stroke-width:.48;fill:none;stroke-linecap:round;stroke-linejoin:round}
          .mark{stroke:#c8412f;stroke-width:.24;fill:none;stroke-linecap:round}
          .ring{stroke:#e0703c;stroke-width:.26;fill:none}
          .dline{stroke:#3c4d63;stroke-width:.19;fill:none;stroke-linecap:round}
          .darrow{fill:#3c4d63}
          .dtext{fill:#202f42;font-family:'Cambria','Times New Roman',serif;font-size:3.4px;text-anchor:middle;dominant-baseline:middle}
          .clabel{fill:#a8452f;font-family:'Cambria','Times New Roman',serif;font-size:2.25px;dominant-baseline:middle}
          #dw.deep .sketch{stroke-width:.86;stroke:#08131f}
        </style>
        <defs>
            <pattern id="g5" width="5" height="5" patternUnits="userSpaceOnUse">
              <path d="M5 0H0V5" fill="none" stroke="#eef2f6" stroke-width=".12"/>
            </pattern>
            <pattern id="g25" width="25" height="25" patternUnits="userSpaceOnUse">
              <rect width="25" height="25" fill="url(#g5)"/>
              <path d="M25 0H0V25" fill="none" stroke="#e1e9f2" stroke-width=".16"/>
            </pattern>
          </defs>
          <rect x="-50" y="-90" width="98" height="126" fill="url(#g25)"/>
        </svg>
      </div>
      <div class="controls">
        <button class="ctl" id="btnPrev">◀ 上一步</button>
        <button class="ctl primary" id="btnPlay">▶ 播放</button>
        <button class="ctl" id="btnNext">下一步 ▶</button>
        <button class="ctl" id="btnReset">↺ 重来</button>
        <span class="spacer"></span>
        <select class="ctl" id="speed">
          <option value="0.6">0.6× 慢</option>
          <option value="1" selected>1.0×</option>
          <option value="1.6">1.6× 快</option>
          <option value="2.4">2.4× 很快</option>
        </select>
        <label class="chk"><input type="checkbox" id="showaux" checked> 辅助线</label>
        <button class="ctl" id="btnPng">导出 PNG</button>
      </div>
      <div class="legend">
        <span><i></i>粗实线：可见轮廓</span>
        <span><i class="c"></i>点画线：中心线</span>
        <span><i class="a"></i>虚线：作图辅助线</span>
        <span><i class="d"></i>细实线：尺寸</span>
      </div>
      <div class="hint">
        <span>键盘：<b>←</b> 上一步 · <b>→</b> 下一步 · <b>空格</b> 播放/暂停</span>
        <span>点击左侧步骤可直接跳转</span>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
/* ============================================================
   1. 数学工具（单位 mm，O 为钩孔圆心，y 轴向上）
   ============================================================ */
const D2R=Math.PI/180, SQ=Math.sqrt;
const V={
  pol:(c,r,d)=>[c[0]+r*Math.cos(d*D2R), c[1]+r*Math.sin(d*D2R)],
  ang:(c,p)=>Math.atan2(p[1]-c[1],p[0]-c[0])/D2R,
  unit:a=>{const l=Math.hypot(a[0],a[1])||1;return [a[0]/l,a[1]/l];}
};
function cint(c1,r1,c2,r2){
  const d=Math.hypot(c2[0]-c1[0],c2[1]-c1[1]);
  const a=(d*d+r1*r1-r2*r2)/(2*d), h2=r1*r1-a*a;
  if(h2<0) return null;
  const h=SQ(h2), ux=(c2[0]-c1[0])/d, uy=(c2[1]-c1[1])/d;
  const bx=c1[0]+a*ux, by=c1[1]+a*uy;
  return [[bx-h*uy,by+h*ux],[bx+h*uy,by-h*ux]];
}
const sweepTo=(a0,a1,sgn)=>{let d=(a1-a0)%360; if(d<0) d+=360; if(sgn<0) d-=360; return d;};

/* ---- 由尺寸决定的各段圆弧圆心 ---- */
const O=[0,0],           R_EYE=12;
const C29=[5,0],         R29=29;
const C24R=[33,45],      R24=24;
const C36=[27,SQ(1575)], R36=36;
const C24L=[-SQ(1215),-9],R24L=24;
const C14=[-37,SQ(85)],  R14=14;
const R2=2;

/* ---- 切点 ---- */
const T_29_24R=V.pol(C29,R29,V.ang(C29,C24R));
const T_29_14 =V.pol(C29,R29,V.ang(C29,C14));
const PT=(()=>{const p=cint(C24L,R24-R2,C14,R14+R2);return p[0][1]>p[1][1]?p[0]:p[1];})();
const T_R14_R2=V.pol(C14,R14,V.ang(C14,PT));
const T_R24_R2=V.pol(C24L,R24L,V.ang(C24L,PT));
const T_eyeR24=V.pol(O,R_EYE,V.ang(O,C24L));
const T_eye36 =V.pol(O,R_EYE,V.ang(O,C36));
const T_36wall=[-9,C36[1]];

/* ============================================================
   2. SVG 工具（圆弧一律按折线取样，保证与计算结果完全一致）
   ============================================================ */
const NS="http://www.w3.org/2000/svg";
const svg=document.getElementById("dw");
const LY={};
["center","aux","sketch","dim","label","mark"].forEach(n=>{
  const g=document.createElementNS(NS,"g"); svg.appendChild(g); LY[n]=g;
});
function mk(tag,attrs,parent){
  const e=document.createElementNS(NS,tag);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
const f3=n=>Math.round(n*1000)/1000;
const SY=p=>-p[1];
const pLine=(a,b)=>`M${f3(a[0])},${f3(SY(a))}L${f3(b[0])},${f3(SY(b))}`;
function arcPts(c,r,a0,sw){
  const n=Math.max(4,Math.ceil(Math.abs(sw)/1.5));
  const out=[];
  for(let i=0;i<=n;i++) out.push(V.pol(c,r,a0+sw*i/n));
  return out;
}
const pPath=pts=>"M"+pts.map(p=>`${f3(p[0])},${f3(SY(p))}`).join("L");
const pArc=(c,r,a0,sw)=>pPath(arcPts(c,r,a0,sw));
const pPoly=pts=>"M"+pts.map(p=>`${f3(p[0])},${f3(SY(p))}`).join("L")+"Z";

/* ============================================================
   3. 动画登记
   ============================================================ */
let BAG=[], TRIM=[], SPEED=1;

function A(d,cls,layer,o){
  const e=mk("path",{d,class:cls},LY[layer]);
  BAG.push(Object.assign({el:e,kind:"draw"},o||{}));
  return e;
}
function TXT(x,y,s,cls,o){
  o=o||{};
  const e=mk("text",{x:f3(x),y:f3(SY([x,y])),class:cls},LY[o.layer||"label"]);
  e.textContent=s;
  if(o.anchor) e.setAttribute("text-anchor",o.anchor);
  if(o.rot) e.setAttribute("transform",`rotate(${o.rot},${f3(x)},${f3(SY([x,y]))})`);
  if(o.size) e.setAttribute("font-size",o.size);
  BAG.push({el:e,kind:"fade",dur:o.dur||300});
  return e;
}
function LSUB(x,y,main,sub){
  const e=mk("text",{x:f3(x),y:f3(SY([x,y])),class:"clabel"},LY.label);
  e.textContent=main;
  const t=mk("tspan",{dy:"0.55","font-size":"0.72em"},e); t.textContent=sub;
  BAG.push({el:e,kind:"fade",dur:260});
  return e;
}
function CROSS(c,s){
  const g=mk("g",{},LY.mark);
  mk("path",{d:pLine([c[0]-s,c[1]],[c[0]+s,c[1]]),class:"mark"},g);
  mk("path",{d:pLine([c[0],c[1]-s],[c[0],c[1]+s]),class:"mark"},g);
  BAG.push({el:g,kind:"fade",dur:240});
  return g;
}
function RING(c){
  const e=mk("circle",{cx:f3(c[0]),cy:f3(-c[1]),r:"0.5",class:"ring"},LY.mark);
  BAG.push({el:e,kind:"ring",dur:900});
  return e;
}
function arc3(c,r,a0,sw,extA,extB,opt){
  opt=opt||{};
  const sgn=sw>0?1:-1, cls=opt.cls||"sketch", lay=opt.layer||"sketch", dur=opt.dur||620;
  const ed=Math.max(140,dur*0.4);
  if(extA>0){
    const p=mk("path",{d:pArc(c,r,a0-sgn*extA,sgn*extA),class:cls},LY[lay]);
    BAG.push({el:p,kind:"draw",dur:ed}); TRIM.push(p);
  }
  const main=mk("path",{d:pArc(c,r,a0,sw),class:cls},LY[lay]);
  BAG.push({el:main,kind:"draw",dur});
  if(extB>0){
    const p=mk("path",{d:pArc(c,r,a0+sw,sgn*extB),class:cls},LY[lay]);
    BAG.push({el:p,kind:"draw",dur:ed}); TRIM.push(p);
  }
  return main;
}
function line3(p0,p1,p2){
  const m=mk("path",{d:pLine(p0,p1),class:"sketch"},LY.sketch);
  BAG.push({el:m,kind:"draw",dur:360});
  if(p2){
    const e=mk("path",{d:pLine(p1,p2),class:"sketch"},LY.sketch);
    BAG.push({el:e,kind:"draw",dur:180}); TRIM.push(e);
  }
  return m;
}
function locus(c,r,a0,sw){
  const e=mk("path",{d:pArc(c,r,a0,sw),class:"aux"},LY.aux);
  BAG.push({el:e,kind:"draw",dur:520});
  return e;
}
function putArrow(tip,dirDeg,k){
  k=k||1;
  const L=3.0*k,W=1.15*k,u=V.unit([Math.cos(dirDeg*D2R),Math.sin(dirDeg*D2R)]),n=[-u[1],u[0]];
  const p1=[tip[0]-u[0]*L+n[0]*W/2, tip[1]-u[1]*L+n[1]*W/2];
  const p2=[tip[0]-u[0]*L-n[0]*W/2, tip[1]-u[1]*L-n[1]*W/2];
  const e=mk("path",{d:pPoly([tip,p1,p2]),class:"darrow"},LY.dim);
  BAG.push({el:e,kind:"fade",dur:200});
}

/* ============================================================
   4. 尺寸数据
   ============================================================ */
const DIMS=[
  {t:"h",x1:-7,x2:7,y:82,exts:[[[-7,75],[-7,83.4]],[[7,75],[7,83.4]]],txt:"Ø14",tx:0,ty:84.8},
  {t:"v",y1:54,y2:77,x:-13.2,exts:[[[-5,77],[-15,77]],[[-9,54],[-15,54]]],txt:"23",tx:-14.7,ty:65.5,rot:-90},
  {t:"h",x1:-9,x2:9,y:48.4,exts:[],txt:"Ø18",tx:2.2,ty:51.2},
  {t:"v",y1:0,y2:54,x:-45,exts:[[[-9,54],[-46.6,54]]],txt:"54",tx:-46.4,ty:27,rot:-90},
  {t:"h",x1:0,x2:5,y:-7.8,out:true,exts:[[[5,-0.8],[5,-9.4]]],txt:"5",tx:2.5,ty:-5.4},
  {t:"v",y1:-9,y2:0,x:-39.5,exts:[[[-34.2,-9],[-40.7,-9]]],txt:"9",tx:-40.9,ty:-4.6,rot:-90},
  {t:"h",x1:-34.856,x2:0,y:-31,exts:[[[-34.856,-9],[-34.856,-32.8]]],txt:"35",tx:-17.4,ty:-33.7},
  {t:"h",x1:-37,x2:-34.856,y:-26.5,out:true,exts:[[[-37,-2],[-37,-28.3]]],txt:"2",tx:-35.9,ty:-24.4},
  {t:"ld",p:[8.92,8.03],elbow:[16.5,15.0],tail:[20.0,15.0],txt:"Ø24",tx:20.8,ty:15.0,anchor:"start"},
  {t:"ld",p:[6,76],elbow:[11.4,80.2],tail:[14.9,80.2],txt:"C2",tx:15.7,ty:80.2,anchor:"start"},
  {t:"ld",p:[18.2,26.1],elbow:[24.6,30.6],tail:[28.1,30.6],txt:"R24",tx:28.9,ty:30.6,anchor:"start"},
  {t:"ld",p:[-2.49,19.04],elbow:[9,23.2],tail:[12.5,23.2],txt:"R36",tx:13.2,ty:23.2,anchor:"start"},
  {t:"ld",p:[-16.47,6.43],elbow:[-7.7,13.5],tail:[-4.2,13.5],txt:"R24",tx:-3.4,ty:13.5,anchor:"start"},
  {t:"ld",p:[-23.25,6.55],elbow:[-27.6,2.2],tail:[-31.1,2.2],txt:"R14",tx:-31.9,ty:2.2,anchor:"end"},
  {t:"ld",p:[-21.84,9.96],elbow:[-25.2,16.8],tail:[-28.7,16.8],txt:"R2",tx:-29.5,ty:16.8,anchor:"end"},
  {t:"ld",p:[30.1,-14.5],elbow:[36.2,-11.4],tail:[39.7,-11.4],txt:"R29",tx:40.5,ty:-11.4,anchor:"start"}
];
function dimGeo(){
  DIMS.forEach(d=>{
    if(d.t==="h"){
      (d.exts||[]).forEach(e=>A(pLine(e[0],e[1]),"dline","dim",{dur:280}));
      const pad=d.out?3.2:0;
      A(pLine([d.x1-pad,d.y],[d.x2+pad,d.y]),"dline","dim",{dur:420});
      if(d.out){ putArrow([d.x1,d.y],0); putArrow([d.x2,d.y],180); }
      else     { putArrow([d.x1,d.y],180); putArrow([d.x2,d.y],0); }
    }else if(d.t==="v"){
      (d.exts||[]).forEach(e=>A(pLine(e[0],e[1]),"dline","dim",{dur:280}));
      A(pLine([d.x,d.y1],[d.x,d.y2]),"dline","dim",{dur:420});
      putArrow([d.x,d.y2],-90); putArrow([d.x,d.y1],90);
    }else{
      A(pLine(d.p,d.elbow),"dline","dim",{dur:320});
      A(pLine(d.elbow,d.tail),"dline","dim",{dur:200});
      putArrow(d.p,V.ang(d.elbow,d.p),0.78);
    }
  });
}
function dimTxt(){
  DIMS.forEach(d=>TXT(d.tx,d.ty,d.txt,"dtext",{anchor:d.anchor||"middle",rot:d.rot||0}));
}

/* ============================================================

   ============================================================ */
const STEPS=[
{no:"01",title:"画基准中心线",
 body:`<p>画图先画<b>基准</b>：用细点画线画出竖直对称中心线和钩孔水平中心线，交点即钩孔中心 <b>O</b>。</p>
       <p>全图所有尺寸都从这两条线量起，所以基准线必须画准、画细。</p>`,
 keys:["中心线用细点画线（长划—短划—点）","两条线互相垂直，交点是全图的定位原点","中心线应超出轮廓 3～5 mm"],
 form:"",
 build(){
   A(pLine([0,88],[0,-34]),"center","center",{dur:820,dashed:true});
   A(pLine([-50,0],[44,0]),"center","center",{dur:900,dashed:true});
   CROSS([0,0],1.9);
   LSUB(1.9,2.9,"O","");
 }},

{no:"02",title:"按尺寸画定位线",
 body:`<p>从水平中心线向上量 <span class="hi">54</span>，得 Ø18 上端面（肩部）位置；再向上量 <span class="hi">23</span>，得 Ø14 顶面位置。</p>
       <p>从竖直中心线向左右各量 <span class="hi">7</span>（Ø14/2）和 <span class="hi">9</span>（Ø18/2），得到两段圆柱的轮廓定位线。</p>`,
 keys:["54、23 是高度方向定位尺寸","Ø14、Ø18 是宽度方向定位尺寸","定位线用细实线，可略长于轮廓"],
 form:"肩部 y=54　顶面 y=54+23=77　Ø14 侧线 x=±7　Ø18 侧线 x=±9",
 build(){
   A(pLine([-22,54],[13,54]),"auxline","aux",{dur:520});
   A(pLine([-14,77],[13,77]),"auxline","aux",{dur:520});
   A(pLine([7,44],[7,80]),"auxline","aux",{dur:460});
   A(pLine([-7,44],[-7,80]),"auxline","aux",{dur:460});
   A(pLine([9,42],[9,57]),"auxline","aux",{dur:420});
   A(pLine([-9,36],[-9,57]),"auxline","aux",{dur:420});
 }},

{no:"03",title:"画已知线段（顶部轮廓）",
 body:`<p>沿定位线画出<b>已知线段</b>：Ø14 杆的顶面、C2 倒角、两侧直素线，以及肩部台阶线和 Ø18 两条侧线。</p>
       <p>C2 表示 2×45° 倒角，所以<b>顶面直径 = 14 − 2×2 = Ø10</b>。Ø18 两条侧线就是后面 R24、R36 的“已知直线”，先画长一点，最后统一修剪。</p>`,
 keys:["C2 倒角：倒角宽、高各 2，顶面变为 Ø10","直线先画长，等圆弧画出后再修剪","Ø18 侧线向下画到与连接弧相切处附近"],
 form:"顶面直径 = Ø14 − 2×C2 = 14 − 4 = Ø10",
 build(){
   A(pLine([-5,77],[5,77]),"sketch","sketch",{dur:400});
   A(pLine([5,77],[7,75]),"sketch","sketch",{dur:280});
   A(pLine([-5,77],[-7,75]),"sketch","sketch",{dur:280});
   A(pLine([7,75],[7,54]),"sketch","sketch",{dur:420});
   A(pLine([-7,75],[-7,54]),"sketch","sketch",{dur:420});
   A(pLine([7,54],[9,54]),"sketch","sketch",{dur:280});
   A(pLine([-7,54],[-9,54]),"sketch","sketch",{dur:280});
   line3([9,54],[9,45],[9,43.0]);
   line3([-9,54],[-9,T_36wall[1]],[-9,37.0]);
 }},

{no:"04",title:"画 Ø24 钩孔",
 body:`<p>以 O 为圆心、R12 画钩孔圆（Ø24）。它是<b>已知圆弧</b>——尺寸直接给出，可以直接画出。</p>
       <p>圆和圆弧都要画十字中心线，圆心画中心标记。</p>`,
 keys:["已知圆弧：尺寸齐全，可直接画出","圆的中心线用细点画线","Ø24 是钩孔，属于轮廓"],
 form:"R = Ø24 / 2 = 12",
 build(){
   const a0=V.ang(O,T_eyeR24), a1=V.ang(O,T_eye36);
   const sw=sweepTo(a0,a1,+1);
   A(pArc(O,R_EYE,a0,sw),"sketch","sketch",{dur:1000});
   const rem=mk("path",{d:pArc(O,R_EYE,a0+sw,sweepTo(a0+sw,a0,+1)),class:"sketch"},LY.sketch);
   BAG.push({el:rem,kind:"draw",dur:620}); TRIM.push(rem);
 }},

{no:"05",title:"定 R29 的圆心 O₂",
 body:`<p>钩身下部外轮廓是 R29。注意它的圆心<b>不在 O 上</b>：由尺寸 <span class="hi">5</span> 知，O₂ 在 O 右侧 5 mm，并与 O 等高（在水平中心线上）。</p>
       <p>以 O₂ 为圆心画 R29 弧，先画长一些，两端等修剪。</p>`,
 keys:["尺寸 5 是圆心的水平定位尺寸","圆心在水平中心线上（与 O 等高）","先画长弧，最后统一修剪"],
 form:"O₂ = (5, 0)",
 build(){
   A(pLine([5,10],[5,-9.6]),"auxline","aux",{dur:440});
   CROSS(C29,1.5);
   LSUB(6.6,-3.2,"O","₂");
   arc3(C29,R29,V.ang(C29,T_29_24R),sweepTo(V.ang(C29,T_29_24R),V.ang(C29,C14),-1),12,10,{dur:1150});
 }},

{no:"06",title:"求 O₃ · 画右侧 R24",
 body:`<p>R24 要<b>同时</b>与 Ø18 右侧直线相切、与 R29 相切——这就是“圆弧连接”。圆心 O₃ 由两个条件定出：</p>
       <p>① 与直线 x=9 相切 → 圆心在 <b>x = 9+24 = 33</b> 的平行线上；<br>
          ② 与 R29 <b>外切</b> → 圆心到 O₂ 距离 = <b>29+24 = 53</b>，即在以 O₂ 为圆心 R53 的辅助圆弧上。</p>
       <p>两线交点即 O₃。以 O₃ 为圆心画 R24，两端自然相切。</p>`,
 keys:["与直线相切：圆心在距直线 R 的平行线上","与圆弧外切：两圆心距 = R₁+R₂","切点必在连心线上（直线相切时切点为垂足）"],
 form:"x = 9 + 24 = 33　|O₃O₂| = 29 + 24 = 53",
 build(){
   const a=V.ang(C29,C24R);
   locus(C29,R29+R24,a-16,44);
   A(pLine([33,56],[33,40]),"auxline","aux",{dur:420});
   RING(C24R); CROSS(C24R,1.5);
   LSUB(34.7,47.2,"O","₃");
   arc3(C24R,R24,180,sweepTo(180,V.ang(C24R,T_29_24R),+1),10,10,{dur:820});
 }},

{no:"07",title:"求 O₄ · 画 R36 钩颈",
 body:`<p>R36 是钩颈（内侧）的过渡弧：与 Ø18 <b>左侧直线</b>相切，又与 Ø24 钩孔<b>外切</b>。</p>
       <p>① 距直线 x=−9 为 36 → 圆心在 <b>x = −9+36 = 27</b> 上；<br>
          ② 与 Ø24 外切 → 圆心到 O 距离 = <b>12+36 = 48</b>。</p>
       <p>交点即 O₄，画 R36 弧，两端分别与直线、Ø24 相切。</p>`,
 keys:["外切用 R₁+R₂，内切用 R₁−R₂","切点在 O₄—O 的连心线上","R36 把 Ø18 直线平滑过渡到钩孔"],
 form:"x = −9 + 36 = 27　|O₄O| = 12 + 36 = 48",
 build(){
   const a=V.ang(O,C36);
   locus(O,R_EYE+R36,a-42,84);
   A(pLine([27,50],[27,28]),"auxline","aux",{dur:420});
   RING(C36); CROSS(C36,1.5);
   LSUB(28.9,41.6,"O","₄");
   arc3(C36,R36,V.ang(C36,T_eye36),sweepTo(V.ang(C36,T_eye36),180,-1),10,10,{dur:840});
 }},

{no:"08",title:"求 O₅ · 画内侧 R24",
 body:`<p>钩身内侧还有一段 R24，它与 Ø24 <b>相切</b>，所以圆心到 O 的距离 = <b>24+12 = 36</b>；圆心高低由尺寸 <span class="hi">9</span> 确定——在水平中心线<b>下方 9</b> 处。</p>
       <p>以 O 为圆心 R36 的辅助弧 ∩ 直线 y=−9 → 圆心 O₅。尺寸 <span class="hi">35</span> 是 O₅ 到轴线水平距离的参考尺寸。</p>`,
 keys:["这里的 R36 是辅助圆弧（=24+12），不是轮廓半径","尺寸 9 决定圆心高低；35 供校核","该弧与 Ø24 相切，是钩孔外壁"],
 form:"|O₅O| = 24 + 12 = 36　y = −9　x ≈ −35",
 build(){
   const a=V.ang(O,C24L);
   locus(O,R_EYE+R24L,a-42,84);

   RING(C24L); CROSS(C24L,1.5);
   LSUB(-32.6,-11.4,"O","₅");
   arc3(C24L,R24L,V.ang(C24L,T_R24_R2),sweepTo(V.ang(C24L,T_R24_R2),V.ang(C24L,T_eyeR24),-1),12,12,{dur:840});
 }},

{no:"09",title:"求 O₆ · 画 R14 钩尖外侧",
 body:`<p>钩尖外侧的 R14 与 R29 <b>相切</b>（圆心距 = 29+14 = <b>43</b>）；圆心位置又由尺寸 <span class="hi">35+2=37</span> 定出——在距轴线 37 的竖直线上。</p>
       <p>以 O₂ 为圆心 R43 辅助弧 ∩ 直线 x=−37 → 圆心 O₆。</p>`,
 keys:["35 定出上一步 O₅ 的中心线，2 定出 O₆ 中心线与它的距离","外切 → 两圆心距 = R29+R14 = 43","切点在 O₂O₆ 连心线上"],

   RING(C14); CROSS(C14,1.5);
   LSUB(-35.4,11.2,"O","₆");
   arc3(C14,R14,V.ang(C14,C29),sweepTo(V.ang(C14,C29),V.ang(C14,T_R14_R2),+1),9,9,{dur:720});

{no:"10",title:"求 O₇ · 画 R2 钩尖",
 body:`<p>最后用 <b>R2</b> 小圆弧把 R14 与 R24 光滑连接，形成钩尖。圆心 O₇：</p>
       <p>① 与 R24 <b>内切</b> → 到 O₅ 距离 = 24−2 = <b>22</b>；<br>
          ② 与 R14 <b>外切</b> → 到 O₆ 距离 = 14+2 = <b>16</b>。</p>
       <p>两辅助弧交点即 O₇。至此轮廓全部由直线与圆弧相切闭合。</p>`,
 keys:["内切：圆心距 = R₁−R₂　外切：圆心距 = R₁+R₂","检查所有连接处都应相切，不许出现尖角","轮廓到此闭合"],

   locus(C24L,R24L-R2,a1-48,96);

   RING(PT); CROSS(PT,1.2);
   LSUB(-18.6,4.6,"O","₇");
   arc3(PT,R2,V.ang(PT,T_R14_R2),sweepTo(V.ang(PT,T_R14_R2),V.ang(PT,T_R24_R2),-1),22,22,{dur:520});
 }},

{no:"11",title:"修剪多余线条",

{no:"12",title:"加深轮廓（粗实线）",
 body:`<p>检查无误后，用<b>粗实线</b>（约 0.7 mm，即线宽 b）把可见轮廓描深一遍；同一图样里粗实线宽度要一致。</p>

{no:"13",title:"画尺寸界线和尺寸线",

       <p>再画<b>尺寸线</b>：与被注线段平行，两端画箭头（长 3～4 mm、宽约 1 mm），箭头尖端顶住尺寸界线。</p>`,

{no:"14",title:"标注尺寸数字 · 完成",

       <p>· 线性尺寸数字写在尺寸线<b>上方</b>（竖直尺寸字头朝左）；<br>

/* ============================================================
   6. 播放引擎
   ============================================================ */
function animateItem(it,delay,dur){
  const el=it.el;
  if(it.kind==="fn"){ setTimeout(it.fn,delay); return; }
  if(it.kind==="draw"){
    let L=0; try{L=el.getTotalLength();}catch(e){}
    if(!L){ el.style.opacity=1; return; }
    el.style.strokeDasharray=L;
    el.style.strokeDashoffset=L;
    const a=el.animate([{strokeDashoffset:L},{strokeDashoffset:0}],
      {duration:Math.max(60,dur),delay,fill:"forwards",easing:"linear"});
    a.onfinish=()=>{ el.style.strokeDashoffset=0; if(it.dashed) el.style.strokeDasharray=""; };
  }else if(it.kind==="fade"){
    el.style.opacity=0;
    el.animate([{opacity:0},{opacity:1}],{duration:Math.max(60,dur),delay,fill:"forwards",easing:"ease-out"});
  }else if(it.kind==="ring"){
    try{
      el.animate([{opacity:.9,r:"0.4"},{opacity:0,r:"3.6"}],
        {duration:1150,delay,iterations:2,easing:"ease-out"});
    }catch(e){ el.animate([{opacity:.9},{opacity:0}],{duration:1150,delay,iterations:2}); }
  }else if(it.kind==="retract"){
    let L=0; try{L=el.getTotalLength();}catch(e){}
    if(!L){ el.style.opacity=0; return; }
    el.style.strokeDasharray=L;
    const an=el.animate([{strokeDashoffset:0},{strokeDashoffset:L}],
      {duration:Math.max(80,dur),delay,fill:"forwards",easing:"linear"});
    an.onfinish=()=>{ el.style.opacity=0; };
  }
}
function settle(it){
  const el=it.el;
  if(it.kind==="draw"){ el.style.strokeDashoffset=""; el.style.strokeDasharray=""; }
  else if(it.kind==="fade"){ el.style.opacity=1; }
  else if(it.kind==="ring"){ el.style.opacity=0; }
  else if(it.kind==="retract"){ el.style.opacity=0; }else if(it.kind==="fn"){ it.fn(); }
}
function playBag(items){
  let cursor=0,lastStart=0,end=0;
  items.forEach(it=>{
    const d=(it.dur||400)/SPEED;
    const start=it.par?lastStart:cursor;
    lastStart=start;
    if(!it.par) cursor=start+d*0.72;
    end=Math.max(end,start+d);
    animateItem(it,start,d);
  });
  return end;
}

/* ============================================================
   7. 状态与界面
   ============================================================ */
let cur=0, playing=false, timer=null, lastTotal=0;

function applyAux(){
  const on=document.getElementById("showaux").checked;
  LY.aux.style.opacity = on ? (cur>=12?0.4:1) : 0;
}
function clearAll(){
  Object.values(LY).forEach(g=>{while(g.firstChild)g.removeChild(g.firstChild);});
  LY.aux.style.transition=""; LY.aux.style.opacity=1;
  TRIM.length=0; svg.classList.remove("deep");
}
function buildStep(i,animate){
  BAG=[];
  STEPS[i-1].build();
  const items=BAG.slice();
  if(animate) lastTotal=playBag(items);
  else items.forEach(settle);
}
function gotoStep(n,animate){
  n=Math.max(1,Math.min(STEPS.length,n));
  if(n===cur){updateUI();return;}
  if(n<cur||!animate){
    clearAll();
    for(let i=1;i<=n;i++) buildStep(i,animate&&i===n);
    cur=n;
  }else{
    for(let i=cur+1;i<=n;i++) buildStep(i,animate&&i===n);
    cur=n;
  }
  applyAux(); updateUI();
}
function reset(){ stop(); clearAll(); cur=0; applyAux(); updateUI(); }
function stop(){ playing=false; if(timer){clearTimeout(timer);timer=null;} }

function updateUI(){
  const list=document.getElementById("steplist");
  [...list.children].forEach((b,i)=>{
    b.classList.toggle("active",i===cur-1);
    b.classList.toggle("done",i<cur-1);
  });
  const s=cur>=1?STEPS[cur-1]:null;
  document.getElementById("stepno").textContent=s?s.no:"00";
  document.getElementById("steptitle").textContent=s?s.title:"准备";
  document.getElementById("stepbody").innerHTML=s?s.body:"<p>点击「播放」或「下一步」开始分步作图。</p>";
  document.getElementById("stepkeys").innerHTML=s&&s.keys.length
    ? "<b>作图要点</b><ul>"+s.keys.map(k=>"<li>"+k+"</li>").join("")+"</ul>" : "";
  const f=document.getElementById("stepform");
  if(s&&s.form){ f.style.display="block"; f.textContent=s.form; } else f.style.display="none";
  document.getElementById("bar").style.width=(cur/STEPS.length*100)+"%";
  document.getElementById("btnPrev").disabled=cur<=0;
  document.getElementById("btnNext").disabled=cur>=STEPS.length;
  document.getElementById("btnPlay").textContent=playing?"⏸ 暂停":"▶ 播放";
  const act=list.children[cur-1];
  if(act && window.innerWidth>920) act.scrollIntoView({block:"nearest"});
}
function play(){
  if(playing){ stop(); updateUI(); return; }
  if(cur>=STEPS.length){ clearAll(); cur=0; updateUI(); }
  playing=true; updateUI();
  const tick=()=>{
    if(!playing) return;
    if(cur>=STEPS.length){ playing=false; updateUI(); return; }
    gotoStep(cur+1,true);
    timer=setTimeout(tick,lastTotal+760);
  };
  setTimeout(tick,160);
}

  const list=document.getElementById("steplist");
  STEPS.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="stepbtn";
    b.innerHTML=`<span class="num">${s.no}</span><span>${s.title}</span>`;
    b.onclick=()=>{
      stop(); gotoStep(i+1,true);
      if(window.innerWidth<=920){
        var st=document.querySelector(".stage");
        if(st) st.scrollIntoView({behavior:"smooth",block:"start"});
      }
    };
    list.appendChild(b);
  });
  const table=document.getElementById("dimtable");
  [["Ø14","杆部直径"],["Ø18","钩颈直径"],["Ø24","钩孔直径"],["R29","下部外轮廓"],
   ["R24","右侧过渡弧"],["R24","内侧（孔壁）"],["R36","钩颈过渡弧"],["R14","钩尖外侧"],
   ["R2","钩尖圆角"],["C2","2×45° 倒角"],["54","肩部到圆心高"],["23","Ø14 段长度"],
   ["5","R29 圆心右移量"],["9","内侧 R24 圆心高"],["35","该圆心水平位置"],["2","R14 中心线偏移"]
  ].forEach(([a,b])=>{
    const d=document.createElement("div"); d.className="dimrow";
    d.innerHTML=`<b>${a}</b><span>${b}</span>`; table.appendChild(d);
  });
  document.getElementById("btnPrev").onclick=()=>{stop();gotoStep(cur-1,false);};
  document.getElementById("btnNext").onclick=()=>{stop();gotoStep(cur+1,true);};
  document.getElementById("btnPlay").onclick=play;
  document.getElementById("btnReset").onclick=reset;
  document.getElementById("speed").onchange=e=>{SPEED=parseFloat(e.target.value);};
  document.getElementById("showaux").onchange=applyAux;
  document.getElementById("showref").onchange=e=>{
    document.getElementById("refimg").classList.toggle("on",e.target.checked);
  };
  document.getElementById("btnPng").onclick=()=>{
    const clone=svg.cloneNode(true);
    clone.setAttribute("width",1200);
    clone.setAttribute("height",Math.round(1200*126/98));
    const s=new XMLSerializer().serializeToString(clone);
    const blob=new Blob([s],{type:"image/svg+xml;charset=utf-8"});
    const url=URL.createObjectURL(blob), img=new Image();
    img.onload=()=>{
      const c=document.createElement("canvas");
      c.width=1200; c.height=Math.round(1200*126/98);
      const ctx=c.getContext("2d");
      ctx.fillStyle="#fbfaf6"; ctx.fillRect(0,0,c.width,c.height);
      ctx.drawImage(img,0,0,c.width,c.height);
      const a=document.createElement("a");
      a.download="吊钩作图-第"+(cur<10?"0":"")+cur+"步.png";
      a.href=c.toDataURL("image/png"); a.click();
      URL.revokeObjectURL(url);
    };
    img.src=url;
  };
  document.addEventListener("keydown",e=>{
    if(e.key==="ArrowRight"){stop();gotoStep(cur+1,true);e.preventDefault();}
    else if(e.key==="ArrowLeft"){stop();gotoStep(cur-1,false);e.preventDefault();}
    else if(e.key===" "){play();e.preventDefault();}
  });
  const q=new URLSearchParams(location.search);
  const st=parseInt(q.get("step")||"0",10);
  if(st>0) gotoStep(Math.min(st,STEPS.length),false);
  else gotoStep(1,false);
  if(q.get("auto")) setTimeout(function(){play();},250);

  updateUI(); applyAux();
})();
